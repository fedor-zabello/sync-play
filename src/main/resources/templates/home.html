<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Home - Watch Video Together</title>

    <link rel="apple-touch-icon" sizes="180x180" href="/favico/apple-touch-icon.png">
    <link rel="icon" type="image/png" sizes="32x32" href="/favico/favicon-32x32.png">
    <link rel="manifest" href="/favico/site.webmanifest">

    <script type="module" src="/js/channel-service.js"></script>
    <script type="module" src="/js/web-socket.js"></script>
    <script src="/js/user-service.js"></script>
    <script type="module" src="/js/chat.js"></script>

    <script src="https://cdn.jsdelivr.net/npm/sockjs-client@1.5.1/dist/sockjs.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/stompjs@2.3.3/lib/stomp.min.js"></script>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.15.4/css/all.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <link href="/css/chat.css" rel="stylesheet">

</head>
<body>

<div class="container-fluid">
    <div class="row">
        <!-- Sidebar -->
        <div class="col-md-3 col-lg-2 sidebar d-flex flex-column">
            <div class="header d-flex justify-content-between align-items-center" id="welcome-user-container">
                <h5 id="welcome-user">Welcome!</h5>
                <form th:action="@{/logout}" method="post">
                    <input type="hidden" th:name="${_csrf.parameterName}" th:value="${_csrf.token}"/>
                    <button type="submit" class="btn btn-danger btn-sm" id="logout-button">Logout</button>
                </form>
            </div>

            <div class="list-group list-group-flush mt-4 flex-grow-1" id="channels-list"></div>
            <div class="p-3">
                <button class="btn btn-primary w-100" id="create-channel-button">
                    <i class="fas fa-plus"></i> Create New Channel
                </button>
            </div>
        </div>

        <div class="col-md-9 col-lg-10 p-0 m-0">
            <div class="header d-none justify-content-between align-items-center" id="channel-header-container">
                <div class="d-flex align-items-center">
                    <!-- Clickable Channel Name -->
                    <h5>
                        <a href="#" id="channel-header" data-bs-toggle="modal" data-bs-target="#edit-channel-modal">
                            Channel
                        </a>
                    </h5>
                    <span class="badge bg-secondary ms-2" id="subscriber-count">0 subscribers</span>
                </div>
                <button class="btn btn-danger" id="delete-channel-button">
                    <i class="fa fa-trash-alt"></i> Delete channel
                </button>
            </div>

            <div class="content" id="content-container">
                <div id="youtube-container" class="text-center">
                    <h3 class="text-center">🐷</h3>
                </div>
                <div id="chat-container"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Modal for Editing Channel -->
<div class="modal fade" id="edit-channel-modal" tabindex="-1" aria-labelledby="edit-channel-modal-label" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content">
            <div class="modal-header">
                <h5 class="modal-title" id="edit-channel-modal-label">Edit Channel</h5>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
                <!-- Change Channel Name Section -->
                <div class="mb-4">
                    <h6>Change Channel Name</h6>
                    <form id="change-channel-name-form">
                        <div class="mb-3">
                            <label for="channel-name" class="form-label">Channel Name</label>
                            <input type="text" class="form-control" id="channel-name" placeholder="Enter new channel name">
                        </div>
                        <button type="submit" class="btn btn-primary">Save Name</button>
                    </form>
                </div>

                <hr class="my-4">

                <!-- Invite New Members Section -->
                <div class="mb-4">
                    <h6>Invite New Members</h6>
                    <form id="invite-members-form">
                        <div class="mb-3">
                            <label for="invite-members" class="form-label">Invite Members</label>
                            <input type="text" class="form-control" id="invite-members" placeholder="Enter usernames separated by commas">
                        </div>
                        <button type="submit" class="btn btn-success">Send Invites</button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- Bootstrap JS Bundle (includes Popper.js) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://www.youtube.com/iframe_api"></script>

</body>
</html>
